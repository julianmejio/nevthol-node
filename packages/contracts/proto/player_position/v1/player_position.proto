syntax = "proto3";

package player_position.v1;

import "buf/validate/validate.proto";

// Describes the attributes that a player position could have
enum PlayerPositionFlags {
  PLAYER_POSITION_FLAGS_UNSPECIFIED = 0;
  PLAYER_POSITION_FLAGS_IN_COMBAT = 1;
  PLAYER_POSITION_FLAGS_COMMANDER = 2;
}

// Represents the status and position of a player in a certain point in time
message PlayerPosition {
  // Required positioning (always)
  uint32 x = 1 [(buf.validate.field).required = true];
  uint32 y = 2 [(buf.validate.field).required = true];
  optional sint32 z = 3 [(buf.validate.field).required = true];
  // Flags change often, like when the player use amount, which could
  // changes several times in a short time
  uint32 flags = 4;
  // Handshake properties. Sent only at the start of the connection or
  // when the player characters or map change
  optional string character_name = 5;
  optional uint32 map_id = 6;
  optional uint32 mount_id = 7;
  optional uint32 profession_id = 8;
  optional uint32 race_id = 9;
  optional uint32 specialization_id = 10;
}